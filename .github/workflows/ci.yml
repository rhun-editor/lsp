# Vet and test on the three systems rhun runs on; the conformance checker and the headless test
# against the current host on Linux.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./... && go test ./... && go build ./...
      - name: Race checks
        if: runner.os != 'Windows'
        run: go test -race ./...
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Conformance checker
        run: sh tests/check.sh
      - uses: actions/checkout@v4
        with:
          repository: vshvedov/rhun
          path: .rhun
      - name: Build the current host
        run: sh .rhun/build.sh
      - name: Headless test
        run: sh tests/run.sh "$PWD/.rhun/build/rhun"
