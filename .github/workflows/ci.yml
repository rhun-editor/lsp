name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./... && go build ./...
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    uses: rhun-editor/extension-template/.github/workflows/release.yml@v1
    with:
      name: lsp
