name = lsp
owner = rhun-editor
title = Language Server
description = Completion, problems, hover, definitions, implementations, references, hierarchies, symbols, code actions, rename (across files, as one undo), formatting and linked editing from your language servers.
icon = icon.png
color = #3f9f6f
version = 0.3.0
protocol = 1
run.linux-x86_64 = bin/lsp-linux-x86_64
run.macos-arm64 = bin/lsp-macos-arm64
run.windows-x64 = bin/lsp-windows-x64.exe
on = lang:Go lang:Rust lang:TypeScript lang:JavaScript lang:Python lang:C lang:C++ lang:Zig lang:Lua lang:Ruby lang:Dart lang:Kotlin lang:Swift lang:OCaml lang:Haskell lang:Elixir lang:Nix lang:Terraform lang:YAML lang:JSON lang:HTML lang:CSS

[commands]
restart = Restart Language Servers
reload_configuration = Reload Language Server Settings
cancel_progress = Cancel All Language Server Work

[subscribe]
opened = *
saved = *
edits = *
hover = *

[needs]
documents = write
project = read
run = gopls go rust-analyzer cargo rustc typescript-language-server pyright-langserver clangd zls lua-language-server solargraph dart kotlin-language-server sourcekit-lsp ocamllsp haskell-language-server-wrapper elixir-ls nil terraform-ls yaml-language-server vscode-json-language-server vscode-html-language-server vscode-css-language-server

# the language features of section 12 of the protocol and of protocol 1.1, from the server;
# F12, shift+F12, ctrl+r, ctrl+. , F2 and shift+alt+f are rhun's own keys for them. Each running
# server narrows these to the kinds and files it really serves (provider-scope).
[provides]
complete = *.go *.rs *.ts *.tsx *.js *.jsx *.mjs *.cjs *.py *.c *.h *.cc *.cpp *.cxx *.hpp *.hh *.zig *.lua *.rb *.dart *.kt *.kts *.swift *.ml *.mli *.hs *.ex *.exs *.nix *.tf *.yaml *.yml *.json *.html *.htm *.css
complete.triggers = . : >
signature = *.go *.rs *.ts *.tsx *.js *.jsx *.mjs *.cjs *.py *.c *.h *.cc *.cpp *.cxx *.hpp *.hh *.zig *.lua *.rb *.dart *.kt *.kts *.swift *.ml *.mli *.hs *.ex *.exs *.nix *.tf *.yaml *.yml *.json *.html *.htm *.css
signature.triggers = ( ,
