name = lsp
owner = rhun-editor
title = Language Server
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/lsp-linux-x86_64
run.macos-arm64 = bin/lsp-macos-arm64
run.windows-x64 = bin/lsp-windows-x64.exe
on = lang:Go lang:Rust lang:TypeScript lang:JavaScript lang:Python lang:C lang:C++ lang:Zig lang:Lua lang:Ruby lang:Dart lang:Kotlin lang:Swift lang:OCaml lang:Haskell lang:Elixir lang:Nix lang:Terraform lang:YAML lang:JSON lang:HTML lang:CSS

[commands]
definition = Go to Definition | F12
restart = Restart Language Servers

[subscribe]
opened = *
saved = *
edits = *
cursor = *
hover = *

[needs]
documents = read
project = read
run = gopls rust-analyzer typescript-language-server pyright-langserver clangd zls lua-language-server solargraph dart kotlin-language-server sourcekit-lsp ocamllsp haskell-language-server-wrapper elixir-ls nil terraform-ls yaml-language-server vscode-json-language-server vscode-html-language-server vscode-css-language-server
